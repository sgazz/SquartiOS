# Publishes marketing/ to the gh-pages branch.
# Repo Settings → Pages → Build: "Deploy from a branch" → gh-pages / (root)
name: Deploy marketing site

on:
  push:
    branches: [main]
    paths:
      - "marketing/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: marketing
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy marketing site"
